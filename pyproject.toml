[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tameru-compaction-system"
version = "1.1.0"
description = "Query-aware extractive context compaction for LLM agents - deterministic, local-only, fail-open, reversible"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Benjamin Ang", email = "hello@benjaminang.tv"}]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tameru-compress = "tameru.compress_context:main"

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
