[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tameru-compaction-system"
version = "1.9.0"
description = "Deterministic, query-aware context compaction for LLM agents: no LLM call, local, fail-open, with recoverable originals. A harness-agnostic engine: a Python function, a CLI and a transcript adapter, used by the Tameru plugins for agent harnesses."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Benjamin Ang", email = "hello@benjaminang.tv"}]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tameru-compress = "tameru.compress_context:main"

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
