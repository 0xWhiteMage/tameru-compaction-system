<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" width="1120" height="450" role="img" aria-labelledby="title description">
<title id="title">Tameru v1.4.1 comparison: savings and evidence retention</title>
<desc id="description">16 common tasks, identical inputs and queries. Tameru v1.4.1: 81.9% mean character savings, 16/16 clean cases; LCC mechanical: 36.3% mean character savings, 11/16 clean cases; Headroom TextCrusher: 50.5% mean character savings, 9/16 clean cases; TF-IDF paragraph baseline: 53.4% mean character savings, 9/16 clean cases; LCC → Laya (CPU): 8.0% mean character savings, 11/16 clean cases.</desc>
